[package]
name = "celmux-plugin-airsim"
description = "AirSIM VoWLAN bridge for Celmux: exposes Celmux voice lines to the AirSIM iOS client"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["anti-rainer"]
repository = "https://github.com/anti-rainer/celmux-plugin-airsim"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "celmux-plugin-airsim"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
h2 = { version = "0.4.20", default-features = false }
hkdf = "0.13.0"
hmac = "0.13.0"
http = { version = "1.5.0", default-features = false }
mdns-sd = "0.17.0"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "io-util"] }
tokio-rustls = "0.26"
webpki-roots = { version = "1.0.11", default-features = false }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
